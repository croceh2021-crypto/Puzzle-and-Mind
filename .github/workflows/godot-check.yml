name: Godot project check

concurrency:
  group: puzzle-and-mind-${{ github.workflow }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate project with Godot 4.4.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Import project resources and fail on script errors
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit --verbose 2>&1 | tee /tmp/godot-import.log
          if grep -E -i "SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR: Failed to load" /tmp/godot-import.log; then
            echo "Godot reported a script/import error."
            exit 1
          fi

      - name: Launch main scene and fail on runtime script errors
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee /tmp/godot-runtime.log
          if grep -E -i "SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR: Failed to load" /tmp/godot-runtime.log; then
            echo "Godot reported a runtime script error."
            exit 1
          fi

      - name: Check Android export preset availability
        run: |
          if [ -f export_presets.cfg ]; then
            echo "Android export preset found. APK export can be enabled after Android SDK/export templates are configured."
          else
            echo "Android export preset is not configured yet; this workflow validates the Godot project only."
          fi
