name: Godot Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Setup Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Create temporary debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project resources
        run: godot --headless --editor --path . --quit --verbose

      - name: Diagnose Android export configuration
        run: |
          godot --headless --path . --verbose --export-debug "Android" /tmp/PuzzleAndMind-diagnostic.apk || true
          echo "Diagnostic export completed; the following export step is authoritative."

      - name: Export Android debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          cp "$HOME/.android/debug.keystore" "${{ runner.temp }}/debug.keystore"
          godot --headless --path . --verbose --export-debug "Android" build/PuzzleAndMind-debug.apk

      - name: Verify APK output
        run: |
          test -s build/PuzzleAndMind-debug.apk
          file build/PuzzleAndMind-debug.apk
          ls -lh build/PuzzleAndMind-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Puzzle-and-Mind-Android-Debug
          path: build/PuzzleAndMind-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-emulator-smoke:
    name: Install and test in Pixel 2 Android Emulator
    runs-on: macos-15-intel
    needs: android-debug
    timeout-minutes: 40
    steps:
      - name: Checkout project and emulator test script
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Puzzle-and-Mind-Android-Debug
          path: build

      - name: Verify APK artifact
        run: |
          test -s build/PuzzleAndMind-debug.apk
          ls -lh build/PuzzleAndMind-debug.apk

      - name: Install and test game in Pixel emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -memory 2048 -cores 2
          disable-animations: false
          script: bash .github/scripts/android-emulator-puzzle.sh

      - name: Upload emulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puzzle-and-Mind-Emulator-Test
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
