name: Godot Android debug APK

concurrency:
  group: puzzle-and-mind-${{ github.workflow }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'Scripts/**'
      - 'Art/**'
      - 'Data/**'
      - '*.tscn'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Setup Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Create temporary debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Cache Godot imported resources
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-4.4.1-android-${{ runner.os }}-${{ hashFiles('Art/**', 'Data/**', '*.tscn', 'project.godot') }}
          restore-keys: |
            godot-4.4.1-android-${{ runner.os }}-

      - name: Import project resources
        run: godot --headless --editor --path . --quit --verbose

      - name: Export Android debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          cp "$HOME/.android/debug.keystore" "${{ runner.temp }}/debug.keystore"
          godot --headless --path . --verbose --export-debug "Android" build/PuzzleAndMind-debug.apk

      - name: Create temporary release signing key for optimized test APK
        id: release_key
        run: |
          RELEASE_PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$RELEASE_PASS"
          keytool -genkeypair -v -keystore "${{ runner.temp }}/puzzle-release.keystore" -storepass "$RELEASE_PASS" -alias puzzlemindrelease -keypass "$RELEASE_PASS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Puzzle Mind Test,O=Puzzle Mind,C=YE"
          echo "password=$RELEASE_PASS" >> "$GITHUB_OUTPUT"

      - name: Export optimized ARM64 release APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/puzzle-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: puzzlemindrelease
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ steps.release_key.outputs.password }}
        run: |
          godot --headless --path . --verbose --export-release "Android" build/PuzzleAndMind-optimized.apk
          test -s build/PuzzleAndMind-optimized.apk
          echo "Optimized release APK size:"
          ls -lh build/PuzzleAndMind-optimized.apk
          sha256sum build/PuzzleAndMind-optimized.apk

      - name: Upload optimized ARM64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Puzzle-and-Mind-Android-Optimized-ARM64
          path: build/PuzzleAndMind-optimized.apk
          if-no-files-found: error
          retention-days: 14

      - name: Export x86_64 APK for optional emulator testing
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[emulator-test]'))
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          godot --headless --path . --verbose --export-debug "Android Emulator" build/PuzzleAndMind-emulator.apk
          test -s build/PuzzleAndMind-emulator.apk

      - name: Upload emulator-only APK artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[emulator-test]'))
        uses: actions/upload-artifact@v4
        with:
          name: Puzzle-and-Mind-Android-Emulator
          path: build/PuzzleAndMind-emulator.apk
          if-no-files-found: error
          retention-days: 14

      - name: Verify APK output
        run: |
          test -s build/PuzzleAndMind-debug.apk
          file build/PuzzleAndMind-debug.apk
          ls -lh build/PuzzleAndMind-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Puzzle-and-Mind-Android-Debug
          path: build/PuzzleAndMind-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-emulator-smoke:
    name: Install and test in Pixel 2 Android Emulator
    runs-on: ubuntu-latest
    needs: android-debug
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[emulator-test]'))
    timeout-minutes: 40
    steps:
      - name: Checkout project and emulator test script
        uses: actions/checkout@v4

      - name: Download emulator APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Puzzle-and-Mind-Android-Emulator
          path: build

      - name: Verify APK artifact
        run: |
          test -s build/PuzzleAndMind-emulator.apk
          ls -lh build/PuzzleAndMind-emulator.apk

      - name: Setup Python for screenshot validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install screenshot validation dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Install and test game in Pixel emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -memory 2048 -cores 2
          disable-animations: false
          script: bash .github/scripts/android-emulator-puzzle.sh

      - name: Upload emulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puzzle-and-Mind-Emulator-Test
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  publish-latest-release:
    name: Publish tested phone APK to GitHub Releases
    runs-on: ubuntu-latest
    needs: android-debug
    if: ${{ success() && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    steps:
      - name: Download ARM64 phone APK
        uses: actions/download-artifact@v4
        with:
          name: Puzzle-and-Mind-Android-Debug
          path: release

      - name: Verify release APK
        run: |
          test -s release/PuzzleAndMind-debug.apk
          file release/PuzzleAndMind-debug.apk
          ls -lh release/PuzzleAndMind-debug.apk

      - name: Update latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Android APK
          body: |
            Automatically updated after a successful Android ARM64 build.

            Download **PuzzleAndMind-debug.apk** for Android ARM64 phones.
            This is a debug-signed APK intended for testing. A newer successful build replaces this release asset.
          files: release/PuzzleAndMind-debug.apk
          make_latest: true
          fail_on_unmatched_files: true
